<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موليڤيرا | MOLIVIRA - لزيت الزيتون البكر الممتاز الفاخر</title>
    <style>
        :root { --primary-color: #2c5e3b; --secondary-color: #8b9a46; --dark-color: #1e3525; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9fbf9; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .about-section { background: var(--white); padding: 30px; border-radius: 12px; border-right: 5px solid var(--secondary-color); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .product-card { background: var(--white); border-radius: 12px; overflow: hidden; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .product-img { width: 100%; height: 250px; object-fit: cover; background-color: #eaeaea; }
        .contact-section { background: var(--dark-color); color: var(--white); padding: 40px 30px; border-radius: 12px; text-align: center; }
        .whatsapp-btn { background-color: #25D366; color: var(--white); padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 20px; }
        .emails-box a { color: #79b3f2; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <section class="about-section">
            <h2>موليڤيرا للتصدير وتجارة المواد الغذائية</h2>
            <p>زيت زيتون بكر ممتاز، عصرة أولى على البارد، من أجود المزارع المصرية.</p>
        </section>

        <h2 style="text-align:center; color:#2c5e3b;">الأحجام المتاحة</h2>
        <section class="products-grid">
            <div class="product-card">
                <img src="oil-250ml.jpg" alt="250ml" class="product-img" onerror="this.src='https://placeholder.com'">
                <h3>250 مل</h3>
            </div>
            <div class="product-card">
                <img src="oil-500ml.jpg" alt="500ml" class="product-img" onerror="this.src='https://placeholder.com'">
                <h3>500 مل</h3>
            </div>
            <div class="product-card">
                <img src="oil-1liter.jpg" alt="1Liter" class="product-img" onerror="this.src='https://placeholder.com'">
                <h3>1 لتر</h3>
            </div>
        </section>

        <section class="contact-section">
            <h2>لطلب والتعاقد</h2>
            <a href="https://wa.me" class="whatsapp-btn">واتساب: 201024266851+</a>
            <div class="emails-box">
                <p>📧 <a href="mailto:info@molivira.com">info@molivira.com</a></p>
                <p>✈️ <a href="mailto:export@molivira.com">export@molivira.com</a></p>
            </div>
        </section>
    </div>
</body>
</html>
